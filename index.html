<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETAHNCORP Archives</title>
  <link rel="icon" type="image/png" href="etahncorp-logo.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0c0c0c; color: #ccc; font: 16px/1.15 Consolas, 'Lucida Console', monospace; }
    main { min-height: 100vh; padding: 38px 8px 16px; }
    p { margin: 0; }
    .muted { color: inherit; }
    form { margin: 18px 0 0; }
    label { display: flex; align-items: baseline; gap: 1ch; }
    input { flex: 1; min-width: 0; max-width: 400px; border: 0; border-radius: 0; padding: 0; margin: 0; background: transparent; color: inherit; caret-color: #ccc; font: inherit; outline: none; }
    input:focus-visible { box-shadow: none; }
    button, .launch { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
    button:hover, .launch:hover { background: #ccc; color: #0c0c0c; }
    button:focus-visible, a:focus-visible { outline: 1px dotted #ccc; outline-offset: 2px; }
    #loginForm button { margin-top: 18px; }
    #error:empty { display: none; }
    #error { margin-top: 18px; }
    #records { margin: 18px 0; }
    .record { display: flex; align-items: baseline; gap: 3ch; min-height: 20px; }
    .record small { font: inherit; white-space: nowrap; }
    .record h2 { font: inherit; margin: 0; }
    .record p { display: none; }
    .launch { white-space: nowrap; }
    #logout { margin-top: 18px; }
    [hidden] { display: none !important; }
    #portal { position:fixed; inset:0; padding:32px clamp(16px,4vw,64px) 20px; background:#f3f5f7; color:#233041; font:14px/1.5 'Segoe UI',sans-serif; display:flex; flex-direction:column; }
    .sheet-title { display:flex; align-items:center; gap:12px; padding:0 0 16px; }
    .sheet-title img { width:38px; height:38px; border-radius:8px; }
    .sheet-title strong { font-size:20px; font-weight:650; letter-spacing:-.4px; }
    .sheet-toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-bottom:24px; color:#596778; }
    #portal #logout { margin:0; padding:7px 14px; border:1px solid #d0d8e1; border-radius:6px; background:white; color:#3a4b5e; white-space:nowrap; }
    #portal #logout:hover { background:#e9eef3; }
    .search-bar { padding:16px 20px; background:white; border:1px solid #dde3e9; border-bottom:0; border-radius:10px 10px 0 0; }
    .search-bar label { align-items:center; color:#637084; font-size:13px; gap:14px; }
    #gameSearch { max-width:430px; width:100%; background:#f7f9fb; color:#233041; border:1px solid #dbe2ea; border-radius:6px; padding:10px 12px; font:inherit; caret-color:#233041; }
    #gameSearch:focus-visible { outline:2px solid #357fb3; outline-offset:2px; }
    #searchStatus { font-size:12px; color:#677789; margin-top:6px; }
    #searchStatus:empty { display:none; }
    .sheet-grid { flex:1; min-height:0; overflow:auto; background:white; border:1px solid #dde3e9; border-radius:0 0 10px 10px; }
    table { border-collapse:separate; border-spacing:0; width:100%; min-width:740px; }
    th,td { padding:17px 20px; text-align:left; border:0; border-bottom:1px solid #edf0f3; }
    thead th { position:sticky; top:0; z-index:1; background:#f8fafc; color:#637084; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.7px; padding-top:12px; padding-bottom:12px; white-space:nowrap; }
    tbody th { width:48px; color:#8995a3; font-size:12px; font-weight:400; text-align:center; }
    tbody tr:hover { background:#f8fbff; }
    tbody td:nth-child(2) { font-weight:600; white-space:nowrap; }
    tbody td:nth-child(3) { color:#356382; font-size:12px; white-space:nowrap; }
    tbody td:nth-child(4) { color:#778391; font-size:13px; }
    #portal .launch { display:inline-block; border:1px solid #d4e2ef; background:#edf5fc; color:#24608c; border-radius:6px; padding:6px 18px; font-size:13px; font-weight:600; }
    #portal .launch:hover { background:#dcecf9; border-color:#b6cee2; }
    #portal a:focus-visible,#portal button:focus-visible { outline:2px solid #357fb3; outline-offset:2px; }
    .locked td { color:#929ba5; font-size:12px; }
    .locked td:nth-child(2) { font-weight:400; }
    tfoot td { padding:20px; color:#778391; font-size:12px; line-height:1.8; border:0; }
    tfoot a { color:#326e9a; text-underline-offset:3px; }
    .sheet-footer { padding:12px 2px 0; color:#8b96a3; font-size:11px; letter-spacing:.3px; }
    .filter-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #classFilter { border:1px solid #dbe2ea; border-radius:6px; padding:10px 12px; background:#f7f9fb; color:#233041; font:inherit; }
    .preview-dialog { border:0; border-radius:12px; padding:0; width:min(560px,calc(100% - 32px)); box-shadow:0 20px 70px #0005; color:#233041; }
    .preview-dialog::backdrop { background:#15202b99; backdrop-filter:blur(3px); }
    .preview-card { padding:24px; }
    .preview-card h2 { margin:0 0 8px; font-size:21px; }
    .preview-meta { color:#5f7182; font-size:12px; margin-bottom:16px; }
    .preview-card p { margin:0 0 20px; color:#526170; }
    .preview-actions { display:flex; justify-content:flex-end; gap:10px; }
    .preview-actions button,.preview-actions a { border:1px solid #d4e2ef; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; text-decoration:none; }
    .preview-actions .primary { background:#24608c; color:white; }
    .file-viewer { max-height:280px; width:100%; margin:0 0 18px; border-radius:8px; background:#101820; }
    @media(max-width:600px) { #portal { padding:20px 12px 12px; } .sheet-title strong { font-size:17px; } .sheet-toolbar { font-size:12px; padding-bottom:18px; } .search-bar { padding:12px; } .search-bar label { align-items:stretch; flex-direction:column; gap:6px; } }
    @media (max-width: 500px) { body { font-size: 14px; } .record { gap: 1ch; flex-wrap: wrap; margin-bottom: 8px; } }
      body { background: #000; }
    #terminal { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    #login { width: min(100%, 320px); }
    #loginForm { margin: 0; }
    #loginForm input { display: block; width: 100%; max-width: none; padding: 12px 0; color: #eee; background: #000; }
    #loginForm input::placeholder { color: #777; }
    #loginForm input:focus-visible { box-shadow: 0 1px #555; }
    #error { color: #aaa; font-size: 13px; line-height: 1.5; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main id="terminal">
    <section id="login">
      <form id="loginForm" aria-label="Sign in">
        <input id="userId" aria-label="User ID" placeholder="ID" autocomplete="username" spellcheck="false" autocapitalize="none" enterkeyhint="next" required autofocus>
        <input id="password" aria-label="Password" placeholder="Password" type="password" autocomplete="current-password" enterkeyhint="go" required>
        <button type="submit" class="visually-hidden" tabindex="-1">Sign in</button>
        <p id="error" role="alert"></p>
      </form>
    </section>
  </main>
  <section id="portal" hidden aria-label="ETAHNCORP game spreadsheet">
    <div class="sheet-title"><img src="etahncorp-logo.png" alt=""><strong>ETAHNCORP Archives</strong></div>
    <div class="sheet-toolbar"><p id="welcome"></p><button id="logout" type="button">Sign out</button></div>
    <div class="search-bar"><div class="filter-row"><label for="gameSearch">Filter <input id="gameSearch" type="search" placeholder="File name, classification, or description" autocomplete="off"></label><select id="classFilter" aria-label="Filter by classification"><option value="">All classifications</option><option value="Game">Games</option><option value="Media">Media</option></select></div><p id="searchStatus" role="status"></p></div>
    <div class="sheet-grid">
      <table aria-label="Games and clearance levels">
        <thead>
        <tr><th scope="col">#</th><th scope="col">File name</th><th scope="col">Classification</th><th scope="col">Access level</th><th scope="col">Description</th><th scope="col">Preview</th></tr></thead>
        <tbody id="records"></tbody><tfoot><tr><td colspan="5">Got any game recommendations? Feel free to tell me! <a href="mailto:ewnorris@wcs.k12.va.us">ewnorris@wcs.k12.va.us</a></td></tr></tfoot>
      </table>
    </div>
    <div class="sheet-footer">Game Register &nbsp; │ &nbsp; ETAHN CORPORATION</div>
  </section>
  <dialog id="previewDialog" class="preview-dialog"><div class="preview-card"><h2 id="previewTitle"></h2><div id="previewMeta" class="preview-meta"></div><div id="previewBody"></div><div class="preview-actions"><button id="closePreview" type="button">Close</button><a id="previewPlay" class="primary" target="_blank" rel="noopener noreferrer">Play</a></div></div></dialog>
  <script>
    // EDIT THIS LIST: change the titles, descriptions, and game URLs.
    // URLs can be your own HTML files or full https:// links to games.
    const accessLevels = {
      1: 'General Access',
      2: 'Corporate Access',
      3: 'Quality Assurance',
      4: 'Executive Access'
    };
    const games = [
      { id: 'game1', title: 'Snake', level: 3, accessLevel: accessLevels[3], description: 'Eat, grow, and avoid the walls. Arrow keys or WASD.', url: 'game1.html' },
      { id: 'game2', title: 'Tetris', level: 3, accessLevel: accessLevels[3], description: 'Stack falling blocks and clear complete lines.', url: 'game2.html' },
      { id: 'game3', title: 'Super Mario Bros.', level: 3, accessLevel: accessLevels[3], description: 'Move: Arrow keys. Jump: X. Run: Z.', url: 'mario/index.html' },
      { id: 'game4', title: 'Super Mario 64', level: 3, accessLevel: accessLevels[3], description: 'Explore the castle and collect Power Stars.', url: 'game4.html' },
      { id: 'game5', title: 'BFDI: Branches', level: 3, accessLevel: accessLevels[3], description: 'Explore the world of BFDI.', url: 'game5.html' },
      { id: 'game6', title: 'BFDIA 5b', level: 3, accessLevel: accessLevels[3], description: 'A Battle for Dream Island platform adventure.', url: 'game6.html' }
      ,{ id: 'a-dance-of-fire-and-ice', title: 'A Dance of Fire and Ice', level: 3, accessLevel: accessLevels[3], description: 'Rhythm game.', url: 'games/a/clADOFAI.html' }
      ,{ id: 'a-dark-room', title: 'A Dark Room', level: 3, accessLevel: accessLevels[3], description: 'Minimalist resource management adventure.', url: 'games/a/clADarkRoom.html' }
      ,{ id: 'a-date-with-death', title: 'A Date With Death', level: 3, accessLevel: accessLevels[3], description: 'Interactive story game.', url: 'games/a/cladatewithdeath.html' }
      ,{ id: 'a-day-in-the-office', title: 'A Day In The Office', level: 3, accessLevel: accessLevels[3], description: 'Office adventure game.', url: 'games/a/cladayintheoffice.html' }
      ,{ id: 'advent-neon', title: 'Advent Neon', level: 3, accessLevel: accessLevels[3], description: 'Neon action platformer.', url: 'games/a/cladventneon.html' }
      ,{ id: 'adventure-capitalist', title: 'Adventure Capitalist', level: 3, accessLevel: accessLevels[3], description: 'Idle business game.', url: 'games/a/clAdventureCapatalist.html' }
      ,{ id: 'ahoy-survival', title: 'Ahoy Survival', level: 3, accessLevel: accessLevels[3], description: 'Survival adventure.', url: 'games/a/clahoysurvival.html' }
      ,{ id: 'airline-tycoon-idle', title: 'Airline Tycoon Idle', level: 3, accessLevel: accessLevels[3], description: 'Idle airline management game.', url: 'games/a/clairlinetycoonidle.html' }
      ,{ id: 'agario-lite', title: 'Agar.io Lite', level: 3, accessLevel: accessLevels[3], description: 'Arcade arena game.', url: 'games/a/clagariolite.html' }
      ,{ id: 'ages-of-conflict', title: 'Ages of Conflict', level: 3, accessLevel: accessLevels[3], description: 'World simulation game.', url: 'games/a/clagesofconflict.html' }
      ,{ id: 'alien-sky-invasion', title: 'Alien Sky Invasion', level: 3, accessLevel: accessLevels[3], description: 'Alien invasion shooter.', url: 'games/a/clalienskyinvasion.html' }
      ,{ id: 'allocation', title: 'Allocation', level: 3, accessLevel: accessLevels[3], description: 'Puzzle game.', url: 'games/a/clallocation.html' }
      ,{ id: 'amidst-the-sky', title: 'Amidst The Sky', level: 3, accessLevel: accessLevels[3], description: 'Arcade adventure.', url: 'games/a/clamidstthesky.html' }
      ,{ id: 'among-us', title: 'Among Us', level: 3, accessLevel: accessLevels[3], description: 'Social deduction game.', url: 'games/a/clamongus.html' }
      ,{ id: 'amorphous-plus', title: 'Amorphous +', level: 3, accessLevel: accessLevels[3], description: 'Arcade action game.', url: 'games/a/clamorphous.html' }
      ,{ id: 'ancient-sins', title: 'Ancient Sins', level: 3, accessLevel: accessLevels[3], description: 'Mystery adventure.', url: 'games/a/clancientsins.html' }
      ,{ id: 'angry-birds', title: 'Angry Birds', level: 3, accessLevel: accessLevels[3], description: 'Physics puzzle game.', url: 'games/a/clangrybirds.html' }
      ,{ id: 'angry-birds-2', title: 'Angry Birds 2', level: 3, accessLevel: accessLevels[3], description: 'Physics puzzle sequel.', url: 'games/a/clangrybirds2.html' }
      ,{ id: 'angry-birds-showdown', title: 'Angry Birds Showdown', level: 3, accessLevel: accessLevels[3], description: 'Angry Birds challenge game.', url: 'games/a/clangrybirdsshowdown.html' }
      ,{ id: 'angry-birds-slingshot-frenzy', title: 'Angry Birds Slingshot Frenzy', level: 3, accessLevel: accessLevels[3], description: 'Slingshot arcade game.', url: 'games/a/clangrybirdsslingshotfrenzy.html' }
      ,{ id: 'animal-crossing', title: 'Animal Crossing', level: 3, accessLevel: accessLevels[3], description: 'Life simulation game.', url: 'games/a/clanimalcrossing.html' }
      ,{ id: 'antimatter-dimensions', title: 'Antimatter Dimensions', level: 3, accessLevel: accessLevels[3], description: 'Incremental space game.', url: 'games/a/clantimatterdimensions.html' }
      ,{ id: 'ant-art-tycoon', title: 'Ant Art Tycoon', level: 3, accessLevel: accessLevels[3], description: 'Art and tycoon game.', url: 'games/a/clantarttycoon.html' }
      ,{ id: 'apes-vs-helium', title: 'Apes vs. Helium', level: 3, accessLevel: accessLevels[3], description: 'Arcade action game.', url: 'games/a/clapesvshelium.html' }
      ,{ id: 'aquapark-io', title: 'Aquapark.io', level: 3, accessLevel: accessLevels[3], description: 'Water slide racing game.', url: 'games/a/claquaparkio.html' }
      ,{ id: 'arcade-volley', title: 'Arcade Volley', level: 3, accessLevel: accessLevels[3], description: 'Arcade sports game.', url: 'games/a/clarcadevolley.html' }
      ,{ id: 'archery-world-tour', title: 'Archery World Tour', level: 3, accessLevel: accessLevels[3], description: 'Archery game.', url: 'games/a/clarcheryworldtour.html' }
      ,{ id: 'archesspelago', title: 'Archesspelago', level: 3, accessLevel: accessLevels[3], description: 'Chess strategy game.', url: 'games/a/clarchesspelago.html' }
      ,{ id: 'arsonate', title: 'Arsonate', level: 3, accessLevel: accessLevels[3], description: 'Card strategy game.', url: 'games/a/clarsonate.html' }
      ,{ id: 'arthurs-nightmare', title: "Arthur's Nightmare", level: 3, accessLevel: accessLevels[3], description: 'Horror adventure.', url: 'games/a/clarthursnightmare.html' }
      ,{ id: 'ascent', title: 'Ascent', level: 3, accessLevel: accessLevels[3], description: 'Arcade climbing game.', url: 'games/a/clascent.html' }
      ,{ id: 'as-duty-demands', title: 'As Duty Demands', level: 3, accessLevel: accessLevels[3], description: 'Interactive adventure.', url: 'games/a/clasdutydemands.html' }
      ,{ id: 'asteroids', title: 'Asteroids', level: 3, accessLevel: accessLevels[3], description: 'Arcade space shooter.', url: 'games/a/clasteroidsALT.html' }
      ,{ id: 'a-small-world-cup', title: 'A Small World Cup', level: 3, accessLevel: accessLevels[3], description: 'Football puzzle game.', url: 'games/a/clasmallworldcup.html' }
      ,{ id: 'aviama-sters', title: 'AviaMasters', level: 3, accessLevel: accessLevels[3], description: 'Aviation game.', url: 'games/a/claviamastersbuggy.html' }
      ,{ id: 'amazing-strange-rope-police', title: 'Amazing Strange Rope Police', level: 3, accessLevel: accessLevels[3], description: 'Open world action game.', url: 'games/a/clstreangeropepolice.html' }
      ,{ id: 'are-we-there-yet', title: 'Are We There Yet?', level: 3, accessLevel: accessLevels[3], description: 'Driving adventure.', url: 'games/a/clarewethereyet.html' }
      ,{ id: 'assessment-examination', title: 'Assessment Examination', level: 3, accessLevel: accessLevels[3], description: 'Interactive examination game.', url: 'games/a/classesmentexaminationque.html' }
      ,{ id: 'chair-test', title: 'Chair Test', level: 3, accessLevel: accessLevels[3], classification: 'Media', description: 'A short chair video test file.', url: 'files/chair-1-1.mov', fileType: 'mov' }
    ];

    // EDIT THIS LIST: each person gets a username, pretend password,
    // and a list of game IDs they can see. IDs/passwords are case-sensitive.
    // This is NOT secure authentication: anyone can read this source code.
    const users = [
      { id: 'general', name: 'General', password: 'general01', clearance: 1 },
      { id: 'corporate', name: 'Corporate', password: 'corporate02', clearance: 2 },
      { id: 'qa', name: 'QA', password: 'quality03', clearance: 3 },
      { id: 'executive', name: 'Executive', password: 'executive04', clearance: 4 },
      { id: 'ethan', name: 'Ethan', clearance: 4, password: 'archive01', games: ['game1', 'game2', 'game3'] },
      { id: 'alex', name: 'Alex', clearance: 1, password: 'echo02', games: ['game1'] },
      { id: 'sam', name: 'Sam', clearance: 3, password: 'night03', games: ['game2', 'game3'] }
    ];

    const login = document.getElementById('login');
    const portal = document.getElementById('portal');
    const form = document.getElementById('loginForm');
    const records = document.getElementById('records');
    const previewDialog = document.getElementById('previewDialog');
    function openPreview(file) {
      document.getElementById('previewTitle').textContent = file.title;
      document.getElementById('previewMeta').textContent = `${file.classification || 'Game'}  •  ${file.accessLevel}`;
      const body = document.getElementById('previewBody');
      body.replaceChildren();
      const description = document.createElement('p');
      description.textContent = file.description;
      body.append(description);
      if ((file.classification || 'Game') !== 'Game' && !file.url.toLowerCase().endsWith('.ecorp')) {
        const viewer = file.fileType === 'mov' ? document.createElement('video') : document.createElement('iframe');
        viewer.className = 'file-viewer';
        if (viewer.tagName === 'VIDEO') { viewer.controls = true; viewer.src = file.url; }
        else { viewer.src = file.url; viewer.title = file.title; }
        body.prepend(viewer);
      }
      const play = document.getElementById('previewPlay');
      play.href = file.url;
      play.hidden = (file.classification || 'Game') !== 'Game';
      previewDialog.showModal();
    }
    document.getElementById('closePreview').addEventListener('click', () => previewDialog.close());
    function applyFilters() {
      const query = document.getElementById('gameSearch').value.trim().toLowerCase();
      const classification = document.getElementById('classFilter').value.toLowerCase();
      let count = 0;
      for (const row of records.rows) {
        // Search only displayed fields, never the names behind locked rows.
        const displayed = Array.from(row.querySelectorAll('td')).slice(0, 3)
          .map((cell) => cell.textContent).join(' ').toLowerCase();
        row.hidden = !(displayed.includes(query) && (!classification || row.dataset.classification === classification));
        if (!row.hidden) count++;
      }
      document.getElementById('searchStatus').textContent = query
        ? (count ? `${count} matching file${count === 1 ? '' : 's'}` : 'No matching files.') : '';
    }
    document.getElementById('gameSearch').addEventListener('input', applyFilters);
    document.getElementById('classFilter').addEventListener('change', applyFilters);

    // Synthesized locally: no audio files or downloads required.
    let typingAudio;
    let clickBuffer;
    function enableTypingAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      try {
        if (!typingAudio) {
          typingAudio = new AudioContext();
          clickBuffer = typingAudio.createBuffer(1, Math.ceil(typingAudio.sampleRate * 0.025), typingAudio.sampleRate);
          const samples = clickBuffer.getChannelData(0);
          for (let i = 0; i < samples.length; i++) {
            samples[i] = (Math.random() * 2 - 1) * Math.exp(-i / (typingAudio.sampleRate * 0.004));
          }
        }
        if (typingAudio.state === 'suspended') return typingAudio.resume().catch(() => {});
      } catch { /* Audio support must never block signing in. */ }
    }
    function playTypingClick() {
      if (!typingAudio || typingAudio.state !== 'running' || !clickBuffer) return;
      const source = typingAudio.createBufferSource();
      const gain = typingAudio.createGain();
      source.buffer = clickBuffer;
      source.playbackRate.value = 0.9 + Math.random() * 0.2;
      gain.gain.value = 0.12;
      source.connect(gain);
      gain.connect(typingAudio.destination);
      source.onended = () => { source.disconnect(); gain.disconnect(); };
      source.start();
    }
    document.addEventListener('pointerdown', enableTypingAudio, true);
    document.addEventListener('keydown', enableTypingAudio, true);
    for (const input of form.querySelectorAll('input')) {
      input.addEventListener('input', (event) => {
        if (event.isComposing) return;
        if (event.inputType?.startsWith('insert')) {
          enableTypingAudio();
          playTypingClick();
        }
      });
    }

    document.getElementById('userId').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('password').focus();
      }
    });
    let signingIn = false;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (signingIn) return;
      const user = users.find((entry) =>
        entry.id === document.getElementById('userId').value.trim() &&
        entry.password === document.getElementById('password').value
      );
      if (!user) {
        document.getElementById('error').textContent = 'ID or game password not recognized.';
        return;
      }
      document.getElementById('error').textContent = '';
      document.getElementById('password').value = '';
      signingIn = true;
      form.inert = true;
      document.getElementById('terminal').hidden = true;
      await new Promise((resolve) => setTimeout(resolve, 900));
      document.getElementById('gameSearch').value = '';
      document.getElementById('classFilter').value = '';
      document.getElementById('searchStatus').textContent = '';
      records.replaceChildren();
      const welcomeLevels = { 1: 'General Access', 2: 'Corporate Team', 3: 'QA Team', 4: 'Executive' };
      const accountLevel = user.clearance ?? Math.max(1, ...games.filter((game) => user.games.includes(game.id)).map((game) => game.level));
      document.getElementById('welcome').textContent = `Welcome, ${user.name || user.id}! Access Level - ${welcomeLevels[accountLevel]}`;
      games.forEach((game, index) => {
        const allowed = user.clearance != null ? game.level <= user.clearance : user.games.includes(game.id);
        const row = document.createElement('tr');
        row.dataset.classification = (game.classification || 'Game').toLowerCase();
        if (!allowed) row.className = 'locked';
        const number = document.createElement('th');
        number.scope = 'row';
        number.textContent = String(index + 1);
        row.append(number);
        const fields = allowed
          ? [game.title, game.classification || 'Game', game.accessLevel, game.description]
          : ['[HIGHER CLEARANCE REQUIRED]', '', '', ''];
        for (const value of fields) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        }
        const playCell = document.createElement('td');
        if (allowed) {
          const button = document.createElement('button');
          button.className = 'launch';
          button.textContent = 'Preview';
          button.setAttribute('aria-label', 'Preview ' + game.title);
          button.addEventListener('click', () => openPreview(game));
          playCell.append(button);
        }
        row.append(playCell);
        records.append(row);
      });
      applyFilters();
      document.getElementById('terminal').hidden = true;


      portal.hidden = false;
      signingIn = false;
      form.inert = false;
      document.getElementById('logout').focus();
    });

    document.getElementById('logout').addEventListener('click', () => {
      portal.hidden = true;
      document.getElementById('terminal').hidden = true;
      login.hidden = false;
      document.getElementById('gameSearch').value = '';
      document.getElementById('searchStatus').textContent = '';
      records.replaceChildren();
      document.getElementById('welcome').textContent = '';
      form.reset();
      document.getElementById('error').textContent = '';
      document.getElementById('terminal').hidden = false;
      document.getElementById('userId').focus();
    });
  </script>
</body>
</html>
