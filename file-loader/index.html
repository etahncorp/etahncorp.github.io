<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETAHNCORP File Loader</title><meta name="referrer" content="no-referrer"><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#ccc;font:16px Consolas,monospace}p{padding:24px}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><p id="status" role="status">Contacting IT Servers…</p><script src="../config.js"></script><script>
(async()=>{
 const status=document.getElementById('status');const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
 try{
  if(!/^[a-f0-9]{64}$/.test(token))throw Error('Access blocked. Open this file through the Archives.');
  if(!window.IT_SERVER_URL)throw Error('IT Servers unavailable.');
  let response;try{response=await fetch(window.IT_SERVER_URL+'/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),signal:AbortSignal.timeout(12000)});}catch{throw Error('IT Servers unavailable. Please try again later.');}
  const result=await response.json();if(!response.ok)throw Error(result.error||'Access denied.');
  const frame=document.createElement('iframe');frame.title='Archive game';frame.allow='autoplay; fullscreen; gamepad';frame.referrerPolicy='no-referrer';frame.src=window.IT_SERVER_URL+result.path;
  // Games cannot access the archive page or its session storage.
  frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-pointer-lock allow-downloads');
  document.body.replaceChildren(frame);
 }catch(error){status.textContent=error.message;}
})();
</script></body></html>
